 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Batch ID Card Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- HTML2PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        .id-card {
            width: 300px;
            background: #0f172a;
            color: #fff;
            border-radius: 16px;
            border: 2px solid #3b82f6;
            padding: 20px;
            text-align: center;
            display: inline-block;
            margin: 10px;
        }
    </style>
</head>
<body class="p-4 bg-light text-center">

    <button onclick="downloadPDF()" class="btn btn-primary btn-lg fw-bold mb-4">📥 Download ID Cards (PDF)</button>

    <div id="pdf-area">
        <div class="id-card">
            <h5 class="text-info fw-bold">SMART SCHOOL PRO</h5>
            <hr class="border-secondary">
            <h4 class="fw-bold">Shanmukha C.</h4>
            <p class="badge bg-primary">Class 10 - Sec A</p>
            <p>Roll No: <strong>STU101</strong></p>
            <div class="bg-white p-2 d-inline-block rounded-3">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=STU101" width="90" height="90">
            </div>
        </div>
    </div>

    <script>
        function downloadPDF() {
            const element = document.getElementById('pdf-area');
            html2pdf().from(element).save('Student_ID_Cards.pdf');
        }
    </script>
</body>
</html>
